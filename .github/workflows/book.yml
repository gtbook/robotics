name: deploy-book

# Validate pull requests and deploy when main changes
on:
  pull_request:
  push:
    branches:
      - main

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: module://matplotlib_inline.backend_inline
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      - name: Check Zenodo dataset availability
        timeout-minutes: 4
        shell: bash
        run: |
          url='https://zenodo.org/records/10765346/files/training_rays-199-4.npz'
          if ! curl --fail --silent --show-error --location --head \
            --connect-timeout 10 --max-time 40 \
            --retry 3 --retry-delay 10 --retry-max-time 180 \
            --output /dev/null "$url"; then
            echo "::error::S76's Zenodo dataset is unavailable after retries. Re-run this job when Zenodo recovers. URL: $url"
            exit 1
          fi
          echo "Zenodo dataset is reachable."

      - name: Activate conda env with environment.yml
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          auto-activate-base: false
          activate-environment: gtbook
          python-version: '3.13'
          environment-file: environment.yml

      - run: conda info --envs
        name: Check active env

      - run: conda list
        name: Check versions

      - name: Build Frank and Seth's book
        run: |
          jupyter-book clean .
          touch *.ipynb
          jupyter-book build .

      # Push the book's HTML to github-pages
      - name: GitHub Pages action
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          cname: www.roboticsbook.org
